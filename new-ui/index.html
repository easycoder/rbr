<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Room By Room</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RBR">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="resources/css/tokens.css?v=2611131924">
    <script type='text/javascript' src='https://allspeak.ai/dist/allspeak.js?v=26051101'></script>
    <script type='text/javascript' src='https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js'></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(err => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
    <script>
      // Boot guard. Both the AllSpeak runtime and the MQTT client come from
      // CDNs, and until they arrive nothing on the page can recover anything:
      // a reload that lands while the phone has no network would leave an
      // empty window for ever. The service worker now caches both, so this
      // only fires when they are neither cached nor reachable — it says so
      // and keeps retrying, backing off so a broken CDN is not hammered.
      (function () {
        function booted() { return !!window.AllSpeak && !!window.mqtt; }
        function retry() {
          var tries = 1;
          try { tries = Number(sessionStorage.getItem('boot-retry') || '0') + 1; } catch (e) { /* no storage */ }
          try { sessionStorage.setItem('boot-retry', String(tries)); } catch (e) { /* no storage */ }
          var app = document.getElementById('app');
          if (app && !app.getAttribute('data-boot-warning')) {
            app.setAttribute('data-boot-warning', '1');
            app.innerHTML = '<div style="padding:24px 20px;font:16px/1.5 system-ui,sans-serif;color:#333">'
              + 'Trying to reach Room By Room&hellip;<br>'
              + '<span style="color:#777">The app could not load. It will keep trying; '
              + 'reconnecting brings it back.</span><br>'
              + '<button type="button" style="margin-top:16px;padding:10px 18px;border-radius:10px;'
              + 'border:1px solid #ccc;background:#fff;font:inherit" '
              + 'onclick="location.reload()">Retry now</button></div>';
          }
          setTimeout(function () { location.reload(); }, Math.min(5000 * tries, 60000));
        }
        // A tick after `load`, so the runtime's own onload startup has run.
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (booted()) {
              try { sessionStorage.removeItem('boot-retry'); } catch (e) { /* no storage */ }
              return;
            }
            retry();
          }, 200);
        });
        // The moment the phone has a network again, stop waiting for the backoff.
        window.addEventListener('online', function () { if (!booted()) location.reload(); });
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>

    <pre id="allspeak-script" style="display:none">
    !   Room By Room — new UI bootstrap.

        script Loader

        variable Shell
        rest get Shell from `resources/allspeak/shell.allspeak?v=` cat now
        run Shell
    </pre>
  </body>
</html>
