# Configuration for rbr-bundle-copy.service.
#
# The service unit's ExecStart reads this file in place from /home, so the
# settings survive an upgrade that replaces /etc.
#
# The program itself is named in the service unit's ExecStart line. This file
# only supplies the paths and run time that program reads.

[bundle-copy]
# Where incoming journal bundles arrive. This is the parent folder holding one
# mail folder/mbox per installation (QED6, OTHER, ...). The mail folder's own
# name becomes the installation folder under save_path, so keep those names
# consistent: a filter per installation should deliver into a folder of that
# name.
email_path = /home/graham/.thunderbird/rbof2nva.default-release-1/ImapMail/imap.dreamhost.com/INBOX.sbd/RBR.sbd/Bundles.sbd

# Bundles are written to <save_path>/<installation>/<YYYY>/<original filename>.
# Existing files are never overwritten.
save_path = /home/graham/RBR-journal

# Local time, 24-hour HH:MM. The service runs once a day at this time, and
# once at startup if it starts after this time.
run_at = 05:00

# Only relevant when email_path is a Thunderbird profile: by default only
# mbox files whose names match "RBR" or "journal" are read. Set this to true
# to scan every mbox in the profile.
# scan_all_mailboxes = false
